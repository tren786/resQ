<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Under Construction | Coming Soon</title>
  <meta name="description" content="Our website and web application are currently under construction. We are working hard to bring you a great experience soon.">
  <!-- Paste your Google Search Console meta tag right below this line -->

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #1e293b, #0f172a 60%, #020617);
      color: #f8fafc;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Subtle Ambient Glows */
    .glow-1, .glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.45;
    }

    .glow-1 {
      width: 320px;
      height: 320px;
      background: #38bdf8;
      top: -60px;
      left: -60px;
    }

    .glow-2 {
      width: 360px;
      height: 360px;
      background: #6366f1;
      bottom: -80px;
      right: -80px;
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 1;
      max-width: 560px;
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    /* Professional Animated Vector Illustration */
    .illustration {
      width: 110px;
      height: 110px;
      margin: 0 auto 24px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
    }

    .gear-spin {
      transform-origin: 36px 36px;
      animation: spin 10s linear infinite;
    }

    .gear-spin-reverse {
      transform-origin: 68px 64px;
      animation: spinReverse 8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
      100% { transform: rotate(-360deg); }
    }

    /* Status Pill */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #fbbf24;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.3); }
    }

    h1 {
      font-size: 2.15rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1rem;
      color: #94a3b8;
      line-height: 1.65;
      margin-bottom: 32px;
    }

    /* Progress Bar */
    .progress-section {
      text-align: left;
      margin-bottom: 32px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      width: 75%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      border-radius: 999px;
      animation: fillBar 1.8s ease-out;
    }

    @keyframes fillBar {
      from { width: 0%; }
      to { width: 75%; }
    }

    /* Footer */
    .footer {
      padding-top: 22px;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      font-size: 0.9rem;
      color: #64748b;
    }

    .footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .container { padding: 36px 22px; }
      h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <main class="container">
    <!-- Custom Animated Engineering / Construction SVG Icon -->
    <div class="illustration" aria-hidden="true">
      <svg width="72" height="72" viewBox="0 0 96 96" fill="none" xmlns="http://w3.org">

        <g class="gear-spin">

          <path d="M34 17H38V22H34V17ZM34 50H38V55H34V50ZM17 34H22V38H17V34ZM50 34H55V38H50V34ZM21.15 23.98L23.98 21.15L27.51 24.69L24.69 27.51L21.15 23.98ZM44.49 47.31L47.31 44.49L50.85 48.02L48.02 50.85L44.49 47.31ZM21.15 48.02L24.69 44.49L27.51 47.31L23.98 50.85L21.15 48.02ZM44.49 24.69L48.02 21.15L50.85 23.98L47.31 27.51L44.49 24.69Z" fill="#38BDF8"/>
        </g>
        <!-- Secondary Accent Gear -->
        <g class="gear-spin-reverse">

          <path d="M66.5 49H69.5V53.5H66.5V49ZM66.5 74.5H69.5V79H66.5V74.5ZM53 62.5H57.5V65.5H53V62.5ZM78.5 62.5H83V65.5H78.5V62.5ZM56.34 54.46L58.46 52.34L61.64 55.52L59.52 57.64L56.34 54.46ZM74.36 72.48L76.48 70.36L79.66 73.54L77.54 75.66L74.36 72.48ZM56.34 73.54L59.52 70.36L61.64 72.48L58.46 75.66L56.34 73.54ZM74.36 55.52L77.54 52.34L79.66 54.46L76.48 57.64L74.36 55.52Z" fill="#818CF8"/>
        </g>
      </svg>
    </div>

    <div class="status-badge">
      <span class="pulse-dot"></span>
      Under Maintenance
    </div>

    <h1>Site Under Construction</h1>

    <p>
      We are currently building and fine-tuning our website and web application. 
      We'll be live shortly with a brand new experience. Thank you for your patience!
    </p>

    <div class="progress-section">
      <div class="progress-labels">
        <span>Development Progress</span>
        <span>75%</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
    </div>

    <div class="footer">
      Have a question or inquiry? Reach us at <br>
      <a href="mailto:support@yourdomain.com">support@yourdomain.com</a>
    </div>
  </main>

</body>
</html>
